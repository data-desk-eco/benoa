<notebook theme="midnight">
  <title>Data Notebook on Benoa LNG Import Terminal</title>

  <script id="header" type="text/markdown">
    # Data Notebook on Benoa LNG Import Terminal
    *${dateText}*

    The Benoa LNG import terminal is located in Tanjung Benoa, on the south-east
    tip of Bali. It began importing LNG in 2016, initially via the *HSY* vessel,
    then from 2018 onwards the *Karunia Dewata* vessel. Once the LNG is regasified
    it is sent to the Pesanggaran power plant, which supplies around 30% of Bali's
    electricity.

    The Benoa terminal is a small-scale operation. Most cargoes are only around
    10,000 tonnes of LNG, which is much smaller than the average 70,000 tonnes for
    a standard LNG cargo. This makes Benoa different to other major import terminals
    in Indonesia like Lampung or Jawa Satu.

    This data notebook looks at the terminal through three lenses: the **trade
    flows** of LNG arriving at it, the **shipping routes** the carriers run, and
    **satellite imagery** of the site itself. Cargo and position data are from
    Kpler and Global Fishing Watch; imagery is Esri World Imagery.

    ---
  </script>

  <script id="trade_intro" type="text/markdown">
    ## Trade flows

    Every LNG cargo delivered to the terminal since 2016, split by the installation
    the gas was loaded at. Volumes are the discharged quantity in tonnes of LNG.
  </script>

  <script id="benoa_sql" output="benoa" type="application/sql" database="../data/data.duckdb" hidden>
    SELECT year, origin, mass_t / 1000.0 AS kt, cargoes
    FROM benoa_lng_by_origin
    ORDER BY year, origin
  </script>

  <script id="chart" type="module">
    const originOrder = ["Bontang", "Jawa Satu FSRU", "Yamal", "Donggi-Senoro LNG Plant"];
    const originColour = {
      "Bontang":                 "#3987e5",
      "Jawa Satu FSRU":          "#199e70",
      "Yamal":                   "#c98500",
      "Donggi-Senoro LNG Plant": "#008300",
    };
    const rows = benoa.map(d => ({
      year: Number(d.year),
      origin: d.origin,
      kt: Number(d.kt),
      cargoes: Number(d.cargoes),
    }));
    const maxYear = Math.max(...rows.map(d => d.year));

    display(Plot.plot({
      title: "LNG deliveries to Benoa FSU by origin installation",
      subtitle: `Discharged LNG, thousand tonnes · ${maxYear} is year-to-date`,
      width: 880,
      height: 460,
      marginLeft: 56,
      marginBottom: 40,
      x: { label: null, tickFormat: "d" },
      y: { label: "LNG delivered (thousand tonnes)", grid: true },
      color: {
        domain: originOrder,
        range: originOrder.map(o => originColour[o]),
        legend: true,
      },
      marks: [
        Plot.barY(rows, {
          x: "year",
          y: "kt",
          fill: "origin",
          order: originOrder,
          insetLeft: 1,
          insetRight: 1,
          tip: true,
          channels: {
            Origin: { value: "origin" },
            Year: { value: "year" },
            "LNG (kt)": { value: d => d.kt.toFixed(0) },
            Cargoes: { value: "cargoes" },
          },
        }),
        Plot.ruleY([0]),
      ],
    }));
  </script>

  <script id="trade_findings" type="text/markdown">
    **Most cargoes come from Bontang.** Of 237 cargoes since 2016, 190 loaded at
    the Bontang LNG plant in East Kalimantan — the terminal's default supplier for
    the whole record.

    **A supply switch in 2022–23.** Deliveries from the Jawa Satu FSRU off West
    Java ramped up sharply, peaking in 2023. Bontang volumes recovered from 2024.

    **Two one-off origins.** A single cargo arrived from Russia's Yamal plant in
    2021, and one from Donggi-Senoro in Sulawesi in 2025.

    **Deliveries are trending up.** Annual throughput has grown from around
    166 thousand tonnes in 2016 to a record 340 thousand tonnes in 2025, as island
    gas demand has risen.

    ---
  </script>

  <script id="shipping_intro" type="text/markdown">
    ## Shipping routes

    Almost all Bontang cargoes are delivered by a single small LNG carrier, with
    two others stepping in occasionally.
  </script>

  <script id="vessels_sql" output="vessels" type="application/sql" database="../data/data.duckdb" hidden>
    SELECT year, vessel, SUM(mass_t) / 1000.0 AS kt, COUNT(*) AS cargoes
    FROM benoa_lng_trades
    WHERE origin = 'Bontang'
    GROUP BY year, vessel
    ORDER BY year, vessel
  </script>

  <script id="vessel_chart" type="module">
    const vesselOrder = ["Triputra", "Pelita Energy", "Hai Yang Shi You 301"];
    const vesselColour = {
      "Triputra":             "#3987e5",
      "Pelita Energy":        "#199e70",
      "Hai Yang Shi You 301": "#c98500",
    };
    const vrows = vessels.map(d => ({
      year: Number(d.year),
      vessel: d.vessel,
      kt: Number(d.kt),
      cargoes: Number(d.cargoes),
    }));

    display(Plot.plot({
      title: "Vessels carrying Bontang cargoes to Benoa",
      subtitle: "Discharged LNG, thousand tonnes",
      width: 880,
      height: 380,
      marginLeft: 56,
      marginBottom: 40,
      x: { label: null, tickFormat: "d" },
      y: { label: "LNG delivered (thousand tonnes)", grid: true },
      color: {
        domain: vesselOrder,
        range: vesselOrder.map(v => vesselColour[v]),
        legend: true,
      },
      marks: [
        Plot.barY(vrows, {
          x: "year",
          y: "kt",
          fill: "vessel",
          order: vesselOrder,
          insetLeft: 1,
          insetRight: 1,
          tip: true,
          channels: {
            Vessel: { value: "vessel" },
            Year: { value: "year" },
            "LNG (kt)": { value: d => d.kt.toFixed(0) },
            Cargoes: { value: "cargoes" },
          },
        }),
        Plot.ruleY([0]),
      ],
    }));
  </script>

  <script id="map_intro" type="text/markdown">
    The track of *Triputra*, the carrier that runs almost every Bontang cargo,
    from Global Fishing Watch AIS positions over the past year — a tight shuttle
    between the Bontang LNG plant in East Kalimantan and the Benoa FSU off Bali.
  </script>

  <script id="map" type="module">
    const maplibregl = (await import("npm:maplibre-gl")).default;

    const css = document.createElement("style");
    css.textContent = `
      .maplibregl-map { position: relative; overflow: hidden; font: 12px system-ui; }
      .maplibregl-canvas { position: absolute; top: 0; left: 0; }
      .benoa-port-label { color: #fff; font: 600 11px system-ui; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; transform: translateY(-14px); pointer-events: none; }
      .benoa-port-dot { width: 9px; height: 9px; border-radius: 50%; background: #e14b4b; border: 1.5px solid #fff; }
    `;
    document.head.appendChild(css);

    const tracks = await FileAttachment("../data/vessel_tracks.geojson").json();
    const vesselColours = Object.fromEntries(
      tracks.features.map(f => [f.properties.vessel, f.properties.colour]));

    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative;width:100%;height:520px;border-radius:4px;overflow:hidden;";
    const container = document.createElement("div");
    container.style.cssText = "position:absolute;inset:0;";
    wrap.appendChild(container);

    const legend = document.createElement("div");
    legend.style.cssText = "position:absolute;top:10px;left:10px;z-index:1;background:#111a;border:1px solid #444;border-radius:4px;padding:8px 10px;font:12px/1.4 system-ui;color:#eee;";
    legend.innerHTML =
      `<div style="font-weight:700;font-size:13px;">Triputra — vessel track</div>` +
      `<div style="color:#bbb;font-size:11px;margin:2px 0 7px;">Past year · Global Fishing Watch AIS · one vessel shown</div>` +
      Object.entries(vesselColours).map(([v, c]) =>
        `<div><span style="display:inline-block;width:14px;height:3px;background:${c};vertical-align:middle;margin-right:6px;"></span>${v}</div>`).join("");
    wrap.appendChild(legend);

    const views = document.createElement("div");
    views.style.cssText = "position:absolute;bottom:10px;right:10px;z-index:1;display:flex;gap:3px;background:#111a;border:1px solid #444;border-radius:4px;padding:3px;font:12px system-ui;";
    views.innerHTML = `
      <button data-view="terminal" style="padding:5px 10px;border:none;border-radius:3px;cursor:pointer;">Terminal</button>
      <button data-view="route" style="padding:5px 10px;border:none;border-radius:3px;cursor:pointer;">Full route</button>
    `;
    wrap.appendChild(views);
    display(wrap);

    const map = new maplibregl.Map({
      container,
      attributionControl: { compact: true },
      style: {
        version: 8,
        sources: {
          esri: {
            type: "raster",
            tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
            tileSize: 256,
            attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
          },
        },
        layers: [{ id: "esri", type: "raster", source: "esri" }],
      },
      center: [115.21, -8.74],
      zoom: 11,
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

    const TERMINAL = { center: [115.21, -8.74], zoom: 11 };
    const ROUTE_BOUNDS = [[113.0, -9.3], [118.5, 1.0]];
    const btnTerminal = views.querySelector('[data-view="terminal"]');
    const btnRoute = views.querySelector('[data-view="route"]');
    const setActive = (active) => {
      for (const b of [btnTerminal, btnRoute]) {
        const on = b === active;
        b.style.background = on ? "#333" : "transparent";
        b.style.color = on ? "#fff" : "#aaa";
      }
    };
    btnTerminal.onclick = () => { map.flyTo({ ...TERMINAL, duration: 800 }); setActive(btnTerminal); };
    btnRoute.onclick = () => { map.fitBounds(ROUTE_BOUNDS, { padding: 40, duration: 800 }); setActive(btnRoute); };
    setActive(btnTerminal);

    const ports = [
      { name: "Bontang LNG plant", lon: 117.47, lat: 0.13 },
      { name: "Benoa FSU", lon: 115.21, lat: -8.74 },
    ];

    map.on("load", () => {
      map.addSource("tracks", { type: "geojson", data: tracks, attribution: "Vessel track: Global Fishing Watch" });
      map.addLayer({
        id: "tracks-line", type: "line", source: "tracks",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "colour"], "line-width": 1.6, "line-opacity": 0.9 },
      });

      for (const p of ports) {
        const el = document.createElement("div");
        el.innerHTML = `<div class="benoa-port-dot"></div><div class="benoa-port-label">${p.name}</div>`;
        new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([p.lon, p.lat]).addTo(map);
      }

      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
      map.on("mousemove", "tracks-line", (e) => {
        map.getCanvas().style.cursor = "pointer";
        const v = e.features[0].properties.vessel;
        popup.setLngLat(e.lngLat).setHTML(`<strong>${v}</strong>`).addTo(map);
      });
      map.on("mouseleave", "tracks-line", () => {
        map.getCanvas().style.cursor = "";
        popup.remove();
      });
    });
  </script>

  <script id="route_findings" type="text/markdown">
    **One vessel does most of the work.** The small LNG carrier *Triputra* has run
    the Bontang shuttle for the entire record — 180 of the 190 Bontang cargoes, and
    the only vessel mapped here. *Pelita Energy* covered eight cargoes between 2021
    and 2025 and *Hai Yang Shi You 301* two in the early years, but neither is
    plotted: Pelita is a secondary relief carrier, and Hai Yang Shi You 301 left
    the route before the AIS record shown begins.

    ---
  </script>

  <script id="satellite_intro" type="text/markdown">
    ## Satellite imagery

    The terminal occupies a wharf in the port of Benoa, on the south-east tip of
    Bali. High-resolution imagery over the past decade shows how the site changed
    as LNG imports began and the floating storage unit was installed and replaced.
  </script>

  <script id="gallery_intro" type="text/markdown">
    ### The terminal over time

    Historical high-resolution views of the wharf, showing the arrival and change
    of the FSRU as the terminal came into service.
  </script>

  <script id="gallery" type="module">
    const shots = [
      { f: FileAttachment("./assets/benoa-2015-05.jpg"), date: "May 2015",
        note: "Before LNG imports began — the wharf handles fuel storage and fishing and service vessels, with no storage unit moored alongside." },
      { f: FileAttachment("./assets/benoa-2016-05.jpg"), date: "May 2016",
        note: "Imports underway: the first FSRU, the HSY, moored at the main wharf." },
      { f: FileAttachment("./assets/benoa-2019-06.jpg"), date: "June 2019",
        note: "The larger Karunia Dewata FSRU, on station since 2018, moored at the wharf." },
      { f: FileAttachment("./assets/benoa-2025-05.jpg"), date: "May 2025",
        note: "The Karunia Dewata still on station, with a smaller shuttle carrier alongside discharging a cargo." },
    ];
    for (const s of shots) s.url = await s.f.url();

    let i = 0;
    const root = document.createElement("div");
    root.style.cssText = "max-width:1000px;margin:0 auto;";
    root.innerHTML = `
      <div style="position:relative;border-radius:6px;overflow:hidden;background:#000;">
        <img id="g-img" style="width:100%;height:auto;display:block;" />
        <button id="g-prev" aria-label="Previous image" style="position:absolute;top:50%;left:12px;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:#000a;color:#fff;font-size:24px;line-height:1;cursor:pointer;">‹</button>
        <button id="g-next" aria-label="Next image" style="position:absolute;top:50%;right:12px;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:#000a;color:#fff;font-size:24px;line-height:1;cursor:pointer;">›</button>
        <div id="g-counter" style="position:absolute;top:12px;right:14px;background:#000a;color:#fff;font:12px system-ui;padding:3px 9px;border-radius:12px;"></div>
      </div>
      <div id="g-dots" style="display:flex;gap:7px;justify-content:center;margin-top:12px;"></div>
      <figcaption id="g-cap" style="margin-top:10px;font:13px/1.5 system-ui;color:var(--theme-foreground-muted);text-align:center;"></figcaption>
    `;
    display(root);

    const img = root.querySelector("#g-img");
    const cap = root.querySelector("#g-cap");
    const counter = root.querySelector("#g-counter");
    const dots = shots.map((_, k) => {
      const d = document.createElement("button");
      d.setAttribute("aria-label", `Go to image ${k + 1}`);
      d.style.cssText = "width:10px;height:10px;border-radius:50%;border:none;padding:0;cursor:pointer;";
      d.onclick = () => show(k);
      root.querySelector("#g-dots").appendChild(d);
      return d;
    });

    function show(k) {
      i = (k + shots.length) % shots.length;
      const s = shots[i];
      img.src = s.url;
      img.alt = `Benoa terminal, ${s.date}`;
      cap.innerHTML = `<strong style="color:var(--theme-foreground);">${s.date}.</strong> ${s.note}`;
      counter.textContent = `${i + 1} / ${shots.length}`;
      dots.forEach((d, k2) => d.style.background = k2 === i ? "var(--theme-foreground)" : "#888");
    }
    root.querySelector("#g-prev").onclick = () => show(i - 1);
    root.querySelector("#g-next").onclick = () => show(i + 1);
    show(0);
  </script>

  <script id="satellite_note" type="text/markdown">
    *Imagery: Google Earth Pro (© Maxar Technologies, Landsat / Copernicus).*
  </script>

    const dateText = commitDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  </script>
